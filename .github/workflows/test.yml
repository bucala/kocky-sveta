name: 🧪 Tests — Kocky sveta

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testy a build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies (lockfile)
        run: npm ci

      - name: 🧪 Unit testy
        run: npm test

      - name: 🏗️ Produkčný build
        run: npm run build

      - name: 🐍 Testy podpisovania Android
        run: python3 -m unittest discover -s scripts/tests -v
