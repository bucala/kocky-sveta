name: 🧪 Tests — Kocky sveta
on:
  push:
    branches:
      - refactor/modularize-app  # Toto spustí testy automaticky pri každom pushi na túto vetvu
  workflow_dispatch:            # Toto tam nechaj pre budúcnosť
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vitest — useFunnyQueue & hooks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: ✅ Test summary
        if: always()
        run: echo "Tests finished — check results above"
