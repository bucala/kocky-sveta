name: 🧪 Tests — Kocky sveta
on:
  push:
    branches:
      - main
      - refactor/modularize-app # Spustí sa pri pushi na obidve vetvy
  pull_request:
    branches: [main]
  workflow_dispatch:           # Teraz je to správne zarovnané

jobs:
  test:
    name: Vitest — useFunnyQueue & hooks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: ✅ Test summary
        if: always()
        run: echo "Tests finished — check results above"
