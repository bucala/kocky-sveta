name: 📱 Android aplikácia Kocky sveta

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Typ buildu'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧪 Test signing setup
        run: python3 -m unittest discover -s scripts/tests -v

      - name: 🔑 Prepare and validate release signing
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: python3 scripts/prepare-android-signing.py

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build web app
        run: npm run build

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔄 Capacitor sync (android)
        run: npx cap sync android

      - name: 🔧 Apply Android post-sync fixes
        run: node scripts/apply-android-fixes.js

      # android/gradlew is not committed to this repo, so we install the
      # exact Gradle version from android/gradle/wrapper/gradle-wrapper.properties
      # and invoke it directly instead of relying on the wrapper script.
      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🤖 Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 🤖 Assemble Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.keystore
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: ✅ Verify release APK signature and certificate
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-signing/apk-certificate.txt"
          expected=$(sha256sum "$RUNNER_TEMP/android-signing/certificate.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signing/apk-certificate.txt" | tr -d '\r')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK nie je podpísané očakávaným release certifikátom."
            exit 1
          fi
          echo "Release APK podpis a certifikát boli overené."

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kocky-sveta-${{ github.event.inputs.build_type }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🧹 Remove temporary signing material
        if: ${{ always() && inputs.build_type == 'release' }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/android-signing"
