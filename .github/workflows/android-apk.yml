name: 📱 Android aplikácia Kocky sveta

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Typ buildu'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build web app
        run: npm run build

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔄 Capacitor sync (android)
        run: npx cap sync android

      - name: 🔧 Apply Android post-sync fixes
        run: node scripts/apply-android-fixes.js

      # android/gradlew is not committed to this repo, so we install the
      # exact Gradle version from android/gradle/wrapper/gradle-wrapper.properties
      # and invoke it directly instead of relying on the wrapper script.
      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🔑 Decode release keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 nie je nastavený v repozitári — release build nie je možný."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: 🤖 Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 🤖 Assemble Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kocky-sveta-${{ github.event.inputs.build_type }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
