name: Fix Slovak Diacritics (run once)

on:
  workflow_dispatch:

jobs:
  fix-encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix mojibake with Python
        run: |
          python3 - <<'PYEOF'
          import os, glob

          replacements = [
              ('\u251c\u00ed', '\u00e1'),
              ('\u251c\u00cd', '\u00c1'),
              ('\u251c\u015f', '\u00ed'),
              ('\u251c\u017a', '\u00cd'),
              ('\u251c\u2557', '\u00fa'),
              ('\u251c\u00d6', '\u00da'),
              ('\u251c\u2524', '\u00f3'),
              ('\u251c\u0119', '\u00e9'),
              ('\u251c\u00cb', '\u00c9'),
              ('\u2500\u017a', '\u010d'),
              ('\u2500\u00ce', '\u010c'),
              ('\u253c\u00ed', '\u0161'),
              ('\u253c\u00e1', '\u0160'),
              ('\u253c\u017c', '\u017e'),
              ('\u253c\u017b', '\u017d'),
              ('\u253c\u0105', '\u0165'),
              ('\u253c\u0104', '\u0164'),
              ('\u2500\u0107', '\u010f'),
              ('\u2500\u0106', '\u010e'),
              ('\u2500\u017c', '\u013e'),
              ('\u2500\u017b', '\u013d'),
              ('\u253c\u0142', '\u0148'),
              ('\u253c\u0141', '\u0147'),
              ('\u251c\u017c', '\u00fd'),
              ('\u251c\u0141', '\u00dd'),
              ('\u2500\u0139', '\u0155'),
              ('\u251c\u00f1', '\u00e4'),
              ('\u251c\u2534', '\u00f4'),
              ('\u2518\u00bb', '\u016f'),
              ('\u2500\u00d6', '\u2014'),
              ('\u251c\u0104', '\u00e4'),
          ]

          files = []
          for ext in ('*.jsx', '*.js', '*.ts', '*.tsx'):
              files.extend(glob.glob(f'src/**/{ext}', recursive=True))
              files.extend(glob.glob(f'src/{ext}'))

          changed = 0
          for path in set(files):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              original = content
              for bad, good in replacements:
                  content = content.replace(bad, good)
              if content != original:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'Fixed: {path}')
                  changed += 1

          print(f'Total files fixed: {changed}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git diff --staged --quiet || git commit -m "fix: oprava mojibake – slovenská diakritika vo všetkých zdrojových súboroch"
          git push
