name: Fix Slovak Diacritics (run once)

on:
  workflow_dispatch:

jobs:
  fix-encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix mojibake with Python
        run: |
          python3 - <<'PYEOF'
          import os, glob

          REPLACEMENTS = [
              ('├Ą', 'ä'),
              ('├í', 'á'),
              ('├Í', 'Á'),
              ('├', 'í'),
              ('├Ź', 'Í'),
              ('├╗', 'ú'),
              ('├Ö', 'Ú'),
              ('├┤', 'ó'),
              ('├ę', 'é'),
              ('├Ë', 'É'),
              ('─Ź', 'č'),
              ('─Î', 'Č'),
              ('┼í', 'š'),
              ('┼á', 'Š'),
              ('┼ż', 'ž'),
              ('┼Ż', 'Ž'),
              ('┼ą', 'ť'),
              ('┼Ą', 'Ť'),
              ('─ć', 'ď'),
              ('─Ć', 'Ď'),
              ('─ż', 'ľ'),
              ('─Ż', 'Ľ'),
              ('┼', 'ň'),
              ('┼', 'Ň'),
              ('├ż', 'ý'),
              ('├', 'Ý'),
              ('─Ĺ', 'ŕ'),
              ('├ñ', 'ä'),
              ('├┴', 'ô'),
              ('┘»', 'ů'),
              ('─Ö', '—'),
          ]

          exts = ('*.jsx', '*.js', '*.ts', '*.tsx')
          files = []
          for ext in exts:
              files += glob.glob(f'src/**/{ext}', recursive=True)
              files += glob.glob(f'src/{ext}')
          files = list(set(files))

          changed = 0
          for fpath in files:
              try:
                  with open(fpath, 'r', encoding='utf-8') as f:
                      original = f.read()
              except Exception as e:
                  print(f'SKIP {fpath}: {e}')
                  continue
              fixed = original
              for bad, good in REPLACEMENTS:
                  fixed = fixed.replace(bad, good)
              if fixed != original:
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(fixed)
                  changed += 1
                  print(f'FIXED: {fpath}')
              else:
                  print(f'ok:    {fpath}')
          print(f'\nDone: {changed}/{len(files)} files changed.')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git diff --staged --quiet || git commit -m "fix: oprava mojibake – slovenská diakritika vo všetkých zdrojových súboroch"
          git push
          echo "Done!"
