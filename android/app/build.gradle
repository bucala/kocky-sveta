apply plugin: 'com.android.application'

android {
    namespace "sk.bucala.kockysveta"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sk.bucala.kockysveta"
        minSdk       rootProject.ext.minSdkVersion
        targetSdk    rootProject.ext.targetSdkVersion
        versionCode  10
        versionName  "1.6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "custom_url_scheme", applicationId
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: project.findProperty("KEYSTORE_PATH") ?: "release.keystore"
            def keystorePass = System.getenv("KEYSTORE_PASS") ?: project.findProperty("KEYSTORE_PASS")
            def keyAliasVal  = System.getenv("KEY_ALIAS")     ?: project.findProperty("KEY_ALIAS")     ?: "kockysveta"
            def keyPass      = System.getenv("KEY_PASS")      ?: project.findProperty("KEY_PASS")

            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists() && keystorePass && keyPass) {
                storeFile     keystoreFile
                storePassword keystorePass
                keyAlias      keyAliasVal
                keyPassword   keyPass
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePath = System.getenv("KEYSTORE_PATH") ?: project.findProperty("KEYSTORE_PATH") ?: "release.keystore"
            def keystorePass = System.getenv("KEYSTORE_PASS") ?: project.findProperty("KEYSTORE_PASS")
            def keyPass      = System.getenv("KEY_PASS")      ?: project.findProperty("KEY_PASS")

            if (file(keystorePath).exists() && keystorePass && keyPass) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Release signing credentials or keystore file not found (${keystorePath}). Falling back to debug signing config.")
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-share')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
}
