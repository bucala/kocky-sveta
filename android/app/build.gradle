apply plugin: 'com.android.application'

android {
    namespace "sk.bucala.kockysveta"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sk.bucala.kockysveta"
        minSdk       rootProject.ext.minSdkVersion
        targetSdk    rootProject.ext.targetSdkVersion
        versionCode  14
        versionName  "1.7.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "custom_url_scheme", applicationId
    }
    def signingValue = { String name -> System.getenv(name) ?: project.findProperty(name) }
    def releaseKeystorePath = signingValue("KEYSTORE_PATH") ?: "release.keystore"
    def releaseKeystorePass = signingValue("KEYSTORE_PASS")
    def releaseKeyAlias = signingValue("KEY_ALIAS")
    def releaseKeyPass = signingValue("KEY_PASS")

    def hasReleaseSigning = file(releaseKeystorePath).isFile() && releaseKeystorePass && releaseKeyAlias && releaseKeyPass
    def allowDebugSignedRelease = (project.findProperty("allowDebugSignedRelease") ?: "false").toString() == "true"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugSignedRelease) {
                // Iba na lokálne testovanie: ./gradlew assembleRelease -PallowDebugSignedRelease=true
                signingConfig signingConfigs.debug
            }
        }
    }

    // Release build bez podpisových údajov zlyhá (nikdy potichu nepoužije debug kľúč).
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }) {
            if (!hasReleaseSigning && !allowDebugSignedRelease) {
                throw new GradleException("Release signing credentials (KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS) not found. " +
                    "Debug signing is never used for a release build. For a local test only, pass -PallowDebugSignedRelease=true.")
            }
            if (!hasReleaseSigning) {
                logger.warn("allowDebugSignedRelease=true: release APK is signed with the DEBUG key. Do not distribute it.")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // @capacitor/app: hardvérové Späť (Android aj TV ovládač). Bez neho Späť ukončí aplikáciu.
    implementation project(':capacitor-app')
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-share')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
}
