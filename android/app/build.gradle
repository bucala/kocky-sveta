apply plugin: 'com.android.application'

android {
    namespace "sk.bucala.kockysveta"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sk.bucala.kockysveta"
        minSdk       rootProject.ext.minSdkVersion
        targetSdk    rootProject.ext.targetSdkVersion
        versionCode  10
        versionName  "1.6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "custom_url_scheme", applicationId
    }
    signingConfigs {
        release {
            // Must be set via env vars — fail fast instead of silently
            // producing an invalid/insecure release build.
            def keystorePass = System.getenv("KEYSTORE_PASS")
            def keyPass = System.getenv("KEY_PASS")
            if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                if (!keystorePass || !keyPass) {
                    throw new GradleException(
                        "Release signing requires KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS env vars to be set."
                    )
                }
            }
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword keystorePass
            keyAlias      System.getenv("KEY_ALIAS") ?: "kockysveta"
            keyPassword   keyPass
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-share')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
}
